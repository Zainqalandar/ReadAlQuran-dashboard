  <title>Admin Starter</title>

  <!-- FUSE Splash Screen CSS -->
  <style>
    body #fuse-splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #111827;
      color: #F9FAFB;
      z-index: 999999;
      pointer-events: none;
      opacity: 1;
      visibility: visible;
      transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body #fuse-splash-screen img {
      width: 120px;
      max-width: 120px;
    }

    #spinner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
      width: 56px;
    }

    #spinner > div {
      width: 12px;
      height: 12px;
      background-color: #1E96F7;
      border-radius: 100%;
      display: inline-block;
      animation: fuse-bouncedelay 1s infinite ease-in-out both;
    }

    #spinner .bounce1 {
      animation-delay: -0.32s;
    }

    #spinner .bounce2 {
      animation-delay: -0.16s;
    }

    @keyframes fuse-bouncedelay {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1.0);
      }
    }


  </style>
  <!-- / FUSE Splash Screen CSS -->
  <script type="module" crossorigin src="/assets/index-BY93ObFt.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BKMq0TZG.css">
</head>
<body>

<noscript>
  You need to enable JavaScript to run this app.
</noscript>

<div id='root' class='flex'>
  <!-- FUSE Splash Screen -->
  <div id='fuse-splash-screen'>
    <div class='logo'>
      Loading Admin Starter...
    </div>
    <div id='spinner'>
      <div class='bounce1'></div>
      <div class='bounce2'></div>
      <div class='bounce3'></div>
    </div>
  </div>
  <!-- / FUSE Splash Screen -->
</div>
</body>
</html>
